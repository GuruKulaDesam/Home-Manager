<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="A private, local-first command center for home, community and study life.">
  <title>Home Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <aside id="sidebar" aria-label="Primary navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i data-lucide="mountain-snow"></i></span>
      <div><b>Home Manager</b><small>Life, clearly organised</small></div>
    </div>
    <div class="workspace-switcher" role="tablist" aria-label="Workspace">
      <button type="button" role="tab" aria-controls="nav" data-workspace="home"><i data-lucide="house"></i><span>Home</span></button>
      <button type="button" role="tab" aria-controls="nav" data-workspace="community"><i data-lucide="map-pinned"></i><span>Community</span></button>
      <button type="button" role="tab" aria-controls="nav" data-workspace="study"><i data-lucide="book-open"></i><span>Study</span></button>
    </div>
    <div id="workspaceMenuLabel" class="workspace-menu-label"></div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <button type="button" data-route="global/settings"><i data-lucide="settings-2"></i><span>Settings</span></button>
      <button type="button" id="collapse" class="collapse-button" title="Collapse navigation" aria-label="Collapse navigation"><i data-lucide="panel-left-close"></i></button>
    </div>
  </aside>

  <button id="backdrop" aria-label="Close navigation"></button>

  <div class="app-shell">
    <header>
      <button type="button" id="menu" class="icon-button" title="Open navigation" aria-label="Open navigation" aria-expanded="false"><i data-lucide="menu"></i></button>
      <div class="page-identity">
        <small id="breadcrumb">Home Manager</small>
        <h1 id="pageTitle">Today</h1>
      </div>
      <button type="button" id="globalSearch" class="search-trigger" aria-label="Search everything">
        <i data-lucide="search"></i><span>Search everything</span><kbd>Ctrl K</kbd>
      </button>
      <div class="header-actions">
        <button type="button" id="searchMobile" class="icon-button" title="Search" aria-label="Search"><i data-lucide="search"></i></button>
        <button type="button" id="notifications" class="icon-button has-indicator" title="Open notifications" aria-label="Open notifications" aria-expanded="false"><i data-lucide="bell"></i></button>
        <button type="button" id="theme" class="icon-button" title="Toggle contrast theme" aria-label="Toggle contrast theme" aria-pressed="false"><i data-lucide="sun-moon"></i></button>
        <button type="button" id="quickAdd" class="primary"><i data-lucide="plus"></i><span>Add</span></button>
        <span class="avatar" title="Local profile">S</span>
      </div>
    </header>
    <main id="content" tabindex="-1"></main>
  </div>

  <aside id="notificationPanel" class="notification-panel" aria-label="Notifications" aria-hidden="true">
    <div class="panel-heading"><div><small>Attention</small><h2>Household signals</h2></div><button type="button" id="closeNotifications" class="icon-button" aria-label="Close notifications"><i data-lucide="x"></i></button></div>
    <div id="notificationList"></div>
  </aside>

  <nav id="bottomNav" aria-label="Mobile navigation"></nav>

  <dialog id="formDialog" class="side-drawer" aria-labelledby="formTitle">
    <form id="entityForm" method="dialog">
      <span class="drawer-accent" aria-hidden="true"></span>
      <div class="dialog-head"><div><small id="formContext"></small><h2 id="formTitle">Add item</h2><p>Complete the details below. Your data stays in this browser.</p></div><button value="cancel" aria-label="Close"><i data-lucide="x"></i></button></div>
      <div id="formFields" class="drawer-body"></div>
      <menu class="drawer-footer"><button value="cancel">Cancel</button><button value="default" class="primary"><i data-lucide="check"></i><span>Save item</span></button></menu>
    </form>
  </dialog>

  <dialog id="searchDialog" class="search-dialog" aria-label="Search Home Manager">
    <form method="dialog">
      <div class="search-box"><i data-lucide="search"></i><label class="sr-only" for="searchInput">Search all records</label><input id="searchInput" autocomplete="off" placeholder="Search tasks, expenses, people, events and topics"><button value="cancel" aria-label="Close"><i data-lucide="x"></i></button></div>
      <div id="searchResults" aria-live="polite"></div>
    </form>
  </dialog>

  <dialog id="quickDialog" class="side-drawer quick-drawer" aria-labelledby="quickTitle">
    <form method="dialog">
      <span class="drawer-accent" aria-hidden="true"></span>
      <div class="dialog-head"><div><small>Create</small><h2 id="quickTitle">Add to Home Manager</h2><p>Choose what you want to organise.</p></div><button value="cancel" aria-label="Close"><i data-lucide="x"></i></button></div>
      <div id="quickActions" class="quick-grid drawer-body"></div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
