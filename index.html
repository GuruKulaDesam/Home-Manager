<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Manager</title><link rel="stylesheet" href="styles.css"></head><body><aside><h2>Home Manager</h2><button data-page="dashboard" class="active">Dashboard</button><button data-page="calendar">Calendar</button><button data-page="todos">Todos</button><button data-page="notes">Notes</button><button data-page="family">Family</button><button data-page="expenses">Expenses</button></aside><div class="shell"><header><h1 id="title">Dashboard</h1><div><button id="theme">???</button><button id="add">+ Add</button></div></header><main><section id="dashboard" class="page active"><div id="cards" class="cards"></div><div class="grid"><div class="panel"><h3>Today</h3><div id="today"></div></div><div class="panel"><h3>Family activity</h3><canvas id="chart" width="500" height="220"></canvas></div></div></section><section id="calendar" class="page"><div class="panel"><div class="cal-head"><button id="prev">???</button><h3 id="month"></h3><button id="next">???</button></div><div id="cal" class="calendar"></div></div></section><section id="todos" class="page"><div class="panel"><form id="todoForm"><input id="todoText" placeholder="Add a household task"><button>Add</button></form><div id="todoList"></div></div></section><section id="notes" class="page"><div class="panel"><form id="noteForm"><input id="noteTitle" placeholder="Title"><textarea id="noteBody" placeholder="Write a note"></textarea><button>Save note</button></form><div id="noteList" class="notes"></div></div></section><section id="family" class="page"><div id="familyList" class="cards"></div></section><section id="expenses" class="page"><div class="panel"><form id="expenseForm"><input id="expenseName" placeholder="Expense"><input id="expenseAmount" type="number" placeholder="Amount"><button>Add</button></form><div id="expenseList"></div></div></section></main></div><dialog id="quick"><form method="dialog"><h3>Quick event</h3><input id="eventTitle" placeholder="Event"><input id="eventDate" type="date"><button id="saveEvent">Save</button></form></dialog><script src="app.js"></script></body></html>
