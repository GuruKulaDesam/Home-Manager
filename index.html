<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#176b55">
  <title>Home Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar" aria-label="Primary navigation">
    <div class="brand"><span>HM</span><div><b>Home Manager</b><small>One place for everyday life</small></div></div>
    <div class="workspace-switcher" role="tablist" aria-label="Workspace">
      <button data-workspace="home" title="Home workspace">Home</button>
      <button data-workspace="community" title="Community workspace">Community</button>
      <button data-workspace="study" title="Study workspace">Study</button>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom"><button data-route="global/settings"><span class="nav-icon">S</span><span>Settings</span></button><button id="collapse" title="Collapse sidebar">‹</button></div>
  </aside>
  <div id="backdrop"></div>
  <div class="app-shell">
    <header>
      <button id="menu" class="icon-button" title="Open navigation">☰</button>
      <div class="page-identity"><small id="breadcrumb">Home Manager</small><h1 id="pageTitle">Overview</h1></div>
      <button id="globalSearch" class="search-trigger"><span>Search everything</span><kbd>Ctrl K</kbd></button>
      <div class="header-actions"><button id="searchMobile" class="icon-button" title="Search">⌕</button><button id="theme" class="icon-button" title="Toggle theme">◐</button><button id="quickAdd" class="primary">+ Add</button><span class="avatar">S</span></div>
    </header>
    <main id="content"></main>
  </div>
  <nav id="bottomNav" aria-label="Mobile navigation"></nav>

  <dialog id="formDialog"><form id="entityForm" method="dialog"><div class="dialog-head"><div><small id="formContext"></small><h2 id="formTitle">Add item</h2></div><button value="cancel" aria-label="Close">×</button></div><div id="formFields"></div><menu><button value="cancel">Cancel</button><button value="default" class="primary">Save</button></menu></form></dialog>
  <dialog id="searchDialog" class="search-dialog"><form method="dialog"><div class="search-box"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="Search tasks, people, topics, news and contacts"><button value="cancel">×</button></div><div id="searchResults"></div></form></dialog>
  <dialog id="quickDialog"><form method="dialog"><div class="dialog-head"><div><small>Create</small><h2>Quick add</h2></div><button value="cancel">×</button></div><div id="quickActions" class="quick-grid"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/data.js"></script><script src="js/views.js"></script><script src="js/app.js"></script>
</body></html>
